name: CLI checks
on: [push, pull_request]
jobs:
  windows-workflow:
    name: Windows acquisition and integrity
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install tzdata
      - name: Exercise real synthetic collection subprocesses
        run: python -m unittest tests.test_collection_portable_e2e tests.test_ios_collection_portable tests.test_provider_sms_staging tests.test_provider_contacts_boundaries -v
      - name: Verify host evidence staging and parser contracts
        if: ${{ !cancelled() }}
        run: python -m unittest tests.test_container_runner tests.test_sqlite_container_staging tests.test_native_container_review_boundary tests.test_report_container -v
      - name: Verify secret transport and owned process cleanup
        if: ${{ !cancelled() }}
        run: python -m unittest tests.test_signal_customer_intake tests.test_runner_windows tests.test_bounded_archives -v
  test:
    timeout-minutes: 20
    # Windows portability remains experimental; retain visible diagnostics.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check repository publishing boundaries
        run: python tools/repository_preflight.py
      - name: Install Windows IANA timezone data
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Check Windows file and process ownership
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_runner_windows tests.test_windows_file_boundaries tests.test_mulder_runtime tests.test_mulder -v
      - name: Check acquisition and provider evidence boundaries
        if: ${{ !cancelled() }}
        run: python -m unittest tests.test_agent_collection tests.test_android_workflow tests.test_collection_portable_e2e tests.test_contacts_cli_scope tests.test_nonroot tests.test_phone_assessment_scope tests.test_provider_contacts tests.test_provider_contacts_boundaries tests.test_provider_sms tests.test_provider_sms_staging tests.test_trash_collection -v
      - name: Check host staging and Linux worker boundaries
        if: ${{ !cancelled() }}
        run: python -m unittest tests.test_container_runner tests.test_sqlite_container_staging tests.test_native_container_review_boundary tests.test_report_container tests.test_native_container_worker tests.test_native_container_codec_worker tests.test_browser_download_residual -v
      - name: Run standard-library tests
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import faulthandler
          import os
          import sys
          import unittest
          sys.path.insert(0, os.getcwd())
          faulthandler.enable()
          faulthandler.dump_traceback_later(180, repeat=True)
          try:
              result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tests'))
          finally:
              faulthandler.cancel_dump_traceback_later()
          raise SystemExit(0 if result.wasSuccessful() else 1)
      - name: Exercise the CLI
        run: python -m lawliet_mobile demo --workspace demo-output --json
      - name: Verify demo evidence
        run: python -m lawliet_mobile verify --case demo --workspace demo-output --json
