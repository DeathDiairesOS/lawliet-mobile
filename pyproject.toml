[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawliet-mobile"
version = "0.1.0"
description = "Lightweight, local mobile evidence triage and forensic CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
windows = ["tzdata>=2025.2"]
desktop = ["pywebview>=6,<7", "tzdata>=2025.2; sys_platform == 'win32'"]
desktop-qt = ["pywebview[qt]>=6,<7", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.gui-scripts]
lawliet-desktop = "lawliet_mobile.desktop:main"

[project.scripts]
lawliet = "lawliet_mobile.cli:main"
ancalor = "lawliet_mobile.cli:main"
ancalor-mobile = "lawliet_mobile.cli:main"
lawliet-mobile = "lawliet_mobile.cli:main"

[tool.setuptools.packages.find]
include = ["lawliet_mobile*", "ancalor_mobile*"]

[tool.setuptools.package-data]
lawliet_mobile = ["desktop_assets/*.html", "desktop_assets/*.css", "desktop_assets/*.js", "desktop_assets/*.png"]
