[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawliet-mobile"
version = "0.1.0"
description = "Lightweight, local mobile evidence triage and forensic CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lawliet = "lawliet_mobile.cli:main"
ancalor = "lawliet_mobile.cli:main"
ancalor-mobile = "lawliet_mobile.cli:main"
lawliet-mobile = "lawliet_mobile.cli:main"

[tool.setuptools.packages.find]
include = ["lawliet_mobile*", "ancalor_mobile*"]
